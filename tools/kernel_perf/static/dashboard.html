<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kernel Performance Lab</title>
<style>
:root{--bg:#f5f6f2;--paper:#fff;--ink:#1d2b29;--muted:#667772;--line:#dfe5df;--green:#247361;--pale:#edf4f0;--orange:#b26826}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Noto Sans SC",sans-serif}header{padding:22px 32px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;justify-content:space-between}h1{font-size:23px;letter-spacing:-.5px;margin:0}header p{margin:1px 0;color:var(--muted)}button,select,input{font:inherit;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:7px 11px;color:var(--ink)}button{cursor:pointer}button:hover,button.active{background:var(--pale);color:var(--green);border-color:#a1c0b5}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}main{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 101px)}aside{padding:24px 16px;border-right:1px solid var(--line)}.aside-title{font-size:11px;color:var(--muted);letter-spacing:2px;margin:0 8px 12px}.run{width:100%;text-align:left;margin-bottom:8px;padding:12px}.run strong{display:block;overflow-wrap:anywhere}.small{font-size:12px;color:var(--muted)}.workspace{padding:24px 30px;max-width:1550px;width:100%;margin:auto}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}h2{font-size:20px;margin:0}h3{font-size:15px;margin:0 0 10px}p{margin:7px 0}.subtle{color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:16px}.stat label{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:25px;letter-spacing:-.7px;font-weight:600}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0}.card{padding:19px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}.badge{display:inline-block;font-size:11px;padding:2px 8px;background:var(--pale);color:var(--green);border-radius:4px;margin-bottom:10px}.warning{color:var(--orange);background:#fff1de}.unknown{color:var(--muted);background:#eef0ec}.evidence{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin-top:14px}.link{background:none;border:0;border-radius:0;text-align:left;padding:0;color:var(--green);text-decoration:underline;text-underline-offset:3px}.method{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}.method button{display:block;margin:6px 0;width:100%;text-align:left}.scroll{overflow:auto;max-height:500px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;font-weight:500;position:sticky;top:0;background:var(--paper)}td:last-child{overflow-wrap:anywhere}code,pre{font:12px/1.7 ui-monospace,monospace}pre{white-space:pre-wrap;word-break:break-word;margin:0}.two{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}.vocab{display:block;text-align:left;width:100%;margin:7px 0;padding:10px}.note{background:var(--pale);border-left:3px solid var(--green);padding:12px 15px;margin:14px 0}.error{color:#923b2b;background:#fff0ea;padding:12px;border-radius:7px}.empty{padding:40px 20px;text-align:center;color:var(--muted)}a{color:var(--green)}details{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}summary{cursor:pointer;color:var(--green)}.bar{width:100px;height:4px;background:var(--line);margin-top:5px;border-radius:3px}.bar span{display:block;height:100%;background:#69a191;border-radius:3px}ol,ul{padding-left:20px}.concept{margin:10px 0;padding:10px;background:var(--bg);border-radius:7px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:140px}.status{font-size:12px;color:var(--muted)}@media(max-width:1000px){main{grid-template-columns:195px minmax(0,1fr)}.cards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.workspace{padding:20px}.two{grid-template-columns:210px minmax(0,1fr)}}@media(max-width:700px){header{padding:17px}main{display:block}aside{border-right:0;border-bottom:1px solid var(--line);max-height:230px;overflow:auto}.workspace{padding:16px}.method,.two{grid-template-columns:1fr}.heading{display:block}.heading select{max-width:100%;margin-top:8px}.stat b{font-size:21px}header p{font-size:12px}}

.trace-lane{display:grid;grid-template-columns:230px minmax(420px,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line);min-width:680px}.trace-label{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.trace-track{position:relative;height:28px;background:repeating-linear-gradient(90deg,var(--bg) 0,var(--bg) calc(20% - 1px),var(--line) calc(20% - 1px),var(--line) 20%);border-radius:4px}.trace-event{position:absolute;top:5px;height:18px;min-width:2px;border:0;border-radius:3px;padding:0;background:#428978;opacity:.85;overflow:hidden;font-size:10px;color:white;text-align:left;white-space:nowrap}.trace-event.memcpy{background:#ad702f}.trace-event.memset{background:#c08c48}.trace-event.cuda_api{background:#6485b1}.trace-event.nvtx{background:#9262a6}.trace-event.osrt{background:#999}.trace-event:hover{opacity:1;background:#253d36}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}.timeaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-left:242px;min-width:420px}.time-input{max-width:130px}.timeline-scroll{overflow:auto;max-height:540px}.tool-summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
</style>
</head>
<body>
<header><div><h1>Kernel Performance Lab</h1><p>从测量到证据，理解每一次 GPU launch。</p></div><div><span class="status" id="mode"></span> <button id="refresh">刷新记录</button></div></header>
<main><aside><div class="aside-title">实验记录</div><div id="history"></div></aside><section class="workspace"><nav class="nav" aria-label="主导航"><button data-view="analysis" class="active">Kernel · NCU</button><button data-view="timeline">时间线 · NSYS</button><button data-view="metrics">指标词典</button><button data-view="compare">实验对比</button><button data-view="environment">参数与来源</button></nav><div id="content"></div></section></main>
<script id="payload" type="application/json">__PERF_DATA__</script>
<script>
"use strict";
const initial=JSON.parse(document.getElementById("payload").textContent),catalog=initial.catalog;
const cache=new Map(initial.runs.map(r=>[r.id,r]));
let index=initial.runs,selected=index[0]?.id,launchId=null,view=initial.runs[0]?.systems&&!initial.runs[0]?.launches?.length?"timeline":"analysis",metricKey="l2_pct",method="l2_pct",filter="",comparison=null;
let timelineStartMs=null,timelineEndMs=null,timelineKind="gpu";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v==null?"—":typeof v==="number"?v.toLocaleString("en-US",{maximumSignificantDigits:6}):String(v);
const run=()=>cache.get(selected),launch=()=>run()?.launches?.find(l=>l.id===launchId)||run()?.launches?.[0];
const entry=key=>catalog.entries.find(e=>e.id===key);
const help=(key,label)=>`<button class="link" data-metric="${esc(key)}">${esc(label||entry(key)?.name||key)}</button>`;
async function json(url){const response=await fetch(url);if(!response.ok)throw new Error(`读取记录失败 (${response.status})`);return response.json()}
async function ensureRun(id){if(!cache.has(id))cache.set(id,await json("/api/runs/"+encodeURIComponent(id)))}
function history(){ $("history").innerHTML=index.length?index.map(r=>`<button class="run ${r.id===selected?"active":""}" data-run="${esc(r.id)}"><strong>${esc(r.label)}</strong><div class="small">${esc(r.id.slice(0,8))} · ${esc(r.status)}</div><div class="small">${esc(fmt(r.native?.time_ms))} ms · ${esc(r.created_at?.slice(0,16).replace("T"," "))} UTC</div></button>`).join(""):"<p class='empty'>尚无记录。使用 CLI 接入或导入一次实验。</p>";}
function metricValue(e){const l=launch(),r=run();if(l?.summary?.[e.id])return l.summary[e.id].value;if(e.id==="native_time_ms")return r?.native?.time_ms;if(e.id==="tflops")return r?.native?.tflops;if(["spill_load_bytes","spill_store_bytes","stack_frame_bytes"].includes(e.id))return l?.compiler_evidence?.resources?.[e.id];return null}
function stats(){const n=run()?.native||{},l=launch();return `<div class="stats"><div class="stat"><label>独立原生 · 算子平均</label><b>${esc(fmt(n.time_ms))} <small>ms</small></b><div class="small">${n.samples?esc(n.samples.length)+" 个独立样本":"原生结果"}</div></div><div class="stat"><label>NCU · 当前 launch</label><b>${esc(fmt(l?.summary?.duration_seconds?.value==null?null:l.summary.duration_seconds.value*1000))} <small>ms</small></b><div class="small">与原生计时口径分开展示</div></div><div class="stat"><label>已声明工作量</label><b>${esc(fmt(n.tflops))}</b><div class="small">TFLOP/s · 未定义时保持缺失</div></div><div class="stat"><label>正确性 · 当前输入</label><b>${n.check_passed===true?"PASS":n.check_passed===false?"FAIL":"未记录"}</b><div class="small">校验命令与完整输入校验分开记录</div></div></div>`}
function diagnostics(){const cards=launch()?.diagnostics?.cards;if(!cards)return "<div class='panel subtle'>本次没有 NCU launch。独立原生计时已保存；缓存、occupancy 和 spill 动态证据保持缺失。</div>";return `<div class="cards">${cards.map(c=>`<article class="card"><h3>${esc(c.title)}</h3><span class="badge ${esc(c.tone)}">${esc(c.badge)}</span><p>${esc(c.description)}</p><div class="evidence">${c.evidence.map(e=>{const key=catalog.entries.find(i=>i.aliases?.includes(e.metric)||i.name===e.label)?.id;return `${key?help(key,e.label):`<span class="small">${esc(e.label)}</span>`}<span>${esc(fmt(e.value))} <small>${esc(e.unit)}</small></span>`}).join("")}</div><details><summary>证据与边界</summary>${c.notes.map(n=>`<p class="small">${esc(n)}</p>`).join("")}</details></article>`).join("")}</div>`}
function analysis(){const r=run(),l=launch();return `<div class="heading"><div><h2>${esc(r.label)}</h2><p class="subtle">${esc(r.id.slice(0,8))} · ${esc(r.status)} · ${(r.launches||[]).length} 个 launch</p></div>${r.launches?.length?`<select id="launch-select" aria-label="选择 kernel launch">${r.launches.map(i=>`<option value="${esc(i.id)}" ${l?.id===i.id?"selected":""}>#${esc(i.context.ID)} · ${esc(i.kernel)}</option>`).join("")}</select>`:""}</div>${r.error?`<p class="error">${esc(r.error)}</p>`:""}${stats()}${diagnostics()}<section class="panel method"><div><h3>分析方法</h3>${[["l1_pct","L1 / Shared 路径"],["l2_pct","L2 / DRAM 压力"],["spill_store_bytes","寄存器与 Spill"],["eligible_warps","调度与等待"]].map(([k,t])=>`<button data-method="${k}" class="${method===k?"active":""}">${t}</button>`).join("")}</div><div>${methodContent()}</div></section>${l?`<section class="panel"><h3>常用指标 · 当前 launch</h3><div class="scroll"><table><thead><tr><th>指标</th><th>测量值</th><th>单位 / 原始计数器</th></tr></thead><tbody>${Object.entries(l.summary).map(([k,v])=>`<tr><td>${help(k,v.label)}</td><td>${esc(fmt(v.value))}${v.unit==="%"&&v.value!=null?`<div class="bar"><span style="width:${Math.max(0,Math.min(100,v.value))}%"></span></div>`:""}</td><td><span class="small">${esc(v.unit)}</span><br><code>${esc(v.metric)}</code></td></tr>`).join("")}</tbody></table></div></section><section class="panel"><h3>原始指标 · 保留数值、单位与 section</h3><div class="toolbar"><input id="raw-filter" placeholder="搜索原始指标名称" aria-label="搜索原始指标名称"></div><div class="scroll"><table><thead><tr><th>Metric</th><th>原值</th><th>单位</th><th>Section</th></tr></thead><tbody id="raw-body">${rawRows("")}</tbody></table></div></section>`:""}`}
function rawRows(query){return (launch()?.metrics||[]).filter(m=>m.name.toLowerCase().includes(query.toLowerCase())).map(m=>`<tr><td><code>${esc(m.name)}</code></td><td>${esc(m.raw)}</td><td>${esc(m.unit)}</td><td>${esc(m.section)}</td></tr>`).join("")}
function methodContent(){const e=entry(method),lesson=e?.lesson;return `<h3>${esc(lesson?.question||e?.name)}</h3><p>${esc(lesson?.intuition||e?.explanation)}</p>${lesson?`<ol>${lesson.steps.map(s=>`<li><strong>${esc(s.title)}</strong><p>${esc(s.text)}</p></li>`).join("")}</ol>`:""}${help(method,"打开完整讲解 →")}`}
function metrics(){const e=entry(metricKey)||catalog.entries[0],l=e.lesson;return `<h2>指标词典</h2><p class="subtle">${catalog.entries.length} 个指标 · 实际测量与教学例子分开展示</p><div class="toolbar"><input id="vocab-filter" value="${esc(filter)}" placeholder="搜索中文、英文或 NCU 原名" aria-label="搜索词典"></div><div class="two"><div id="vocab-list">${vocabRows()}</div><article class="panel"><h2>${esc(e.name)}</h2><p class="subtle">${esc(e.scope||"")}</p><div class="note">当前实验 / launch：<strong>${esc(fmt(metricValue(e)))} ${esc(e.unit)}</strong></div><p>${esc(e.short)}</p><p>${esc(e.explanation)}</p><p class="subtle">${esc(e.caution)}</p>${l?`<h3>${esc(l.question)}</h3><p>${esc(l.intuition)}</p><details><summary>基础概念</summary>${l.concepts.map(k=>{const c=catalog.concepts[k];return c?`<div class="concept"><strong>${esc(c.title||c.name||k)}</strong><p>${esc(c.meaning||c.text||c.explanation||c.definition||c.intuition||"")}</p><p class="small">${esc(c.example||"")}</p></div>`:""}).join("")}</details><ol>${l.steps.map(s=>`<li><strong>${esc(s.title)}</strong><p>${esc(s.text)}</p></li>`).join("")}</ol><div class="note"><strong>教学例子 · 适用条件由以下假设限定</strong><p>${esc(l.worked.assumptions)}</p>${l.worked.lines.map(v=>`<div>${esc(v)}</div>`).join("")}<p>${esc(l.worked.conclusion)}</p></div><h3>怎样判断</h3>${l.decisions.map(d=>`<p><strong>${esc(d.when)}</strong> · ${esc(d.meaning)}<br><span class="subtle">${esc(d.next)}</span></p>`).join("")}<p>${esc(l.takeaway)}</p><details><summary>${esc(l.quiz.question)}</summary><p>${esc(l.quiz.answer)}</p></details>${l.simulator==="sectors"?`<div class="note"><strong>纸上计算器 · 非硬件模拟</strong><p>假设连续、对齐 float 访问；每线程 4 B，每 sector 32 B。重复访问同一数据。</p><label>参与线程 <input id="sector-threads" type="number" min="1" max="32" value="32"></label><label> 轮数 <input id="sector-rounds" type="number" min="1" max="1000000" value="1000"></label><p id="sector-result"></p></div>`:""}`:""}<p><a href="${esc(e.source)}" target="_blank" rel="noreferrer">NVIDIA 原始文档 ↗</a></p><div class="toolbar">${(e.related||[]).map(k=>help(k)).join(" · ")}</div></article></div>`}
function vocabRows(){const q=filter.toLowerCase();return catalog.entries.filter(e=>JSON.stringify([e.name,e.short,e.aliases,e.lesson?.question]).toLowerCase().includes(q)).map(e=>`<button class="vocab ${e.id===metricKey?"active":""}" data-metric="${esc(e.id)}">${esc(e.name)}<div class="small">${esc(e.unit)}</div></button>`).join("")}
function compare(){const options=index.map(r=>`<option value="${esc(r.id)}">${esc(r.label)} · ${esc(r.id.slice(0,8))}</option>`).join("");return `<h2>实验对比</h2><p class="subtle">输入、计时和硬件条件一致，才计算独立原生速度比。</p>${index.length<2?"<p class='panel'>至少需要两条实验。在 serve 页面中选择历史记录。</p>":`<div class="toolbar"><select id="compare-a" aria-label="基线实验">${options}</select><select id="compare-b" aria-label="候选实验">${options}</select><button id="do-compare">对比</button></div><div id="comparison">${comparison?comparisonHTML(comparison):""}</div>`}`}
function comparisonHTML(c){return `<div class="panel"><h3>${c.comparable?`B 相对 A：${esc(fmt(c.speedup))} × 原生速度比`:"当前条件不满足同条件对比"}</h3>${c.blockers.map(b=>`<p class="error">${esc(b)}</p>`).join("")}<p class="subtle">${esc(c.ncu_note)}</p>${c.warnings.map(w=>`<p class="small">${esc(w)}</p>`).join("")}</div><div class="panel"><h3>条件与实现差异</h3><pre>${esc(JSON.stringify(c.differences,null,2))}</pre></div>`}
function environment(){const r=run();return `<h2>参数与来源</h2><p class="subtle">保存当前实验的配置、环境、构建与文件哈希。</p>${[ ["工具采集状态",r.analyses],["运行环境",r.environment],["构建证据",r.build],["原生结果",r.native],["当前函数编译证据",launch()?.compiler_evidence],["配置",r.config],["原始文件与 SHA-256",r.artifacts] ].map(([t,v])=>`<section class="panel"><h3>${esc(t)}</h3><pre>${esc(JSON.stringify(v??null,null,2))}</pre></section>`).join("")}`}
function timeline(){
 const r=run(),data=r.systems;
 if(!data)return `<h2>Nsight Systems · 时间线</h2><div class="panel"><p>本次尚未记录 NSYS 分析。</p><p class="subtle">启用配置中的 systems.enabled，或用 CLI 导入 .nsys-rep / NSYS SQLite。NCU 的计数器不会被转换成时间线。</p><pre>perf.py import --nsys-report /path/profile.nsys-rep</pre></div>`;
 const count=data.counts||{},gpu=data.gpu_activity||[],end=(data.span_ns||0)/1e6;
 const startMs=timelineStartMs??0,endMs=timelineEndMs??end;
 const groups=data.summary||{};
 return `<div class="heading"><div><h2>${esc(r.label)} · 时间线</h2><p class="subtle">Nsight Systems · kernel、数据搬运与主机调用</p></div><span class="badge">${esc(r.analyses?.nsys?.status||r.status)}</span></div>${r.error?`<p class="error">${esc(r.error)}</p>`:""}<div class="stats"><div class="stat"><label>GPU kernel 事件</label><b>${esc(fmt(count.kernel||0))}</b><div class="small">包含报告中已记录的 warmup / 初始化</div></div><div class="stat"><label>拷贝 / 清零事件</label><b>${esc(fmt((count.memcpy||0)+(count.memset||0)))}</b><div class="small">保留设备、stream 与字节数</div></div><div class="stat"><label>CUDA API 调用</label><b>${esc(fmt(count.cuda_api||0))}</b><div class="small">主机调用时长与 GPU 时长分开</div></div><div class="stat"><label>NVTX 闭合范围</label><b>${esc(fmt(count.nvtx||0))}</b><div class="small">未采集时不推测业务阶段</div></div></div><section class="panel" style="margin-top:18px"><h3>交互时间线</h3><div class="toolbar"><label>起点 <input class="time-input" id="timeline-start" type="number" min="0" step="any" value="${startMs}"> ms</label><label>终点 <input class="time-input" id="timeline-end" type="number" min="0" step="any" value="${endMs}"> ms</label><button id="timeline-apply">缩放</button><button id="timeline-gpu">定位 GPU 工作区间</button><button id="timeline-reset">完整范围</button><select id="timeline-kind" aria-label="时间线事件类型">${[["gpu","GPU kernel / memory"],["all","GPU + CUDA API + NVTX + OSRT"],["cuda_api","CUDA API"],["nvtx","NVTX"],["osrt","OS Runtime"]].map(([v,t])=>`<option value="${v}" ${timelineKind===v?"selected":""}>${t}</option>`).join("")}</select></div><div class="legend">${[["kernel","Kernel","#428978"],["memcpy","Memcpy","#ad702f"],["cuda_api","CUDA API","#6485b1"],["nvtx","NVTX","#9262a6"],["osrt","OSRT","#999"]].map(([k,t,c])=>`<span><i style="background:${c}"></i>${t}</span>`).join("")}</div><p class="small">时间以最早有效 trace 事件为 0。点击色块查看实际时长；修改窗口只缩放下方视图，汇总仍基于整个报告。${data.timeline_sampled?`视图仅显示 ${data.events.length} / ${Object.values(count).reduce((a,b)=>a+b,0)} 条事件，各表最早事件截取；完整统计使用全部有效事件。`:""}</p><div class="timeline-scroll"><div class="timeaxis">${[0,.2,.4,.6,.8,1].map(f=>`<span>${esc(fmt(startMs+(endMs-startMs)*f))} ms</span>`).join("")}</div>${timelineLanes(data,startMs,endMs)}</div><div id="timeline-detail" class="note small">选择一个事件查看 kernel / API、stream、context 和原始时间戳。</div></section><section class="panel"><h3>逐设备 GPU 活动 · 首尾 GPU 事件之间的区间</h3><div class="scroll"><table><thead><tr><th>设备</th><th>区间跨度 ms</th><th>活动并集 ms</th><th>未观察区间 ms</th><th>最大间隙 ms</th><th>被跟踪活动覆盖率</th></tr></thead><tbody>${gpu.map(g=>`<tr><td>GPU ${esc(g.device)}${g.vm!=null?` · VM ${esc(g.vm)}`:""}</td><td>${esc(fmt(g.span_ns/1e6))}</td><td>${esc(fmt(g.observed_union_ns/1e6))}</td><td>${esc(fmt(g.unobserved_ns/1e6))}</td><td>${esc(fmt(g.largest_gap_ns/1e6))}</td><td>${esc(fmt(g.observed_coverage_pct))} %</td></tr>`).join("")}</tbody></table></div><p class="small">并发 stream 的重叠时间只计一次。这里的覆盖率不是 GPU utilization 或 occupancy，未观察区间也不证明硬件空闲。</p></section>${[["kernel","Kernel 汇总"],["memcpy","数据拷贝汇总"],["memset","内存清零汇总"],["cuda_api","CUDA API 汇总"],["nvtx","NVTX 范围汇总"],["osrt","OS Runtime 汇总"]].map(([k,title])=>`<section class="panel"><h3>${title}</h3>${groups[k]?.length?`<div class="scroll"><table><thead><tr><th>名称 / 设备</th><th>次数</th><th>累计 ms</th><th>平均 ms</th><th>同类累计时长占比</th>${k==="memcpy"||k==="memset"?"<th>字节数</th>":""}</tr></thead><tbody>${groups[k].map(g=>`<tr><td><code>${esc(g.name)}</code>${g.device!=null?`<div class="small">GPU ${esc(g.device)}</div>`:""}</td><td>${g.count}</td><td>${esc(fmt(g.total_ns/1e6))}</td><td>${esc(fmt(g.average_ns/1e6))}</td><td>${esc(fmt(g.share_of_category_duration_pct))} %</td>${k==="memcpy"||k==="memset"?`<td>${esc(fmt(g.bytes))}</td>`:""}</tr>`).join("")}</tbody></table></div>`:"<p class='subtle'>没有可用事件，保持缺失。</p>"}</section>`).join("")}<section class="panel"><h3>分析边界与原始报告</h3>${data.notes.map(n=>`<p class="small">${esc(n)}</p>`).join("")}<p>需要完整 Nsight GUI 视图时：</p><pre>perf.py open ${esc(r.id)} --tool nsys --data /path/.kernel-perf</pre><p class="small">原始 .nsys-rep、SQLite 和导出日志随实验保存；SQLite 单独导入时没有原始 GUI 报告。</p></section>`;
}
function timelineLanes(data,startMs,endMs){
 if(endMs<=startMs||data.origin_ns==null)return "<p class='empty'>没有有效时间窗口。</p>";
 const low=data.origin_ns+startMs*1e6,high=data.origin_ns+endMs*1e6,lanes=new Map();
 data.events.forEach((e,id)=>{
  if(e.end_ns<low||e.start_ns>high)return;
  if(timelineKind==="gpu"&&!["kernel","memcpy","memset"].includes(e.kind))return;
  if(!["gpu","all"].includes(timelineKind)&&e.kind!==timelineKind)return;
  const isGPU=["kernel","memcpy","memset"].includes(e.kind),label=isGPU?`GPU ${e.device??"?"} · ${e.vm!=null?"VM "+e.vm+" · ":""}Context ${e.context??"?"} / Stream ${e.stream??"?"} / Process ${e.pid??"?"}`:`${e.kind.toUpperCase()} · Thread ${e.tid??e.pid??"?"}`;
  if(!lanes.has(label))lanes.set(label,[]);lanes.get(label).push({e,id});
 });
 return [...lanes].map(([label,items])=>`<div class="trace-lane"><div class="trace-label">${esc(label)}</div><div class="trace-track">${items.map(({e,id})=>{const left=100*(Math.max(e.start_ns,low)-low)/(high-low),width=100*(Math.min(e.end_ns,high)-Math.max(e.start_ns,low))/(high-low);return `<button class="trace-event ${e.kind}" data-event="${id}" style="left:${left}%;width:${Math.max(.12,width)}%" title="${esc(e.name)} · ${esc(fmt(e.duration_ns/1e6))} ms" aria-label="${esc(e.name)}">${width>=6?esc(e.name):""}</button>`}).join("")}</div></div>`).join("")||"<p class='empty'>当前窗口与过滤条件没有显示事件。</p>";
}
function applyTimelineWindow(){const start=Number($("timeline-start").value),end=Number($("timeline-end").value),max=(run().systems.span_ns||0)/1e6;if(!Number.isFinite(start)||!Number.isFinite(end)||start<0||end<=start||end>max){$("timeline-detail").textContent=`请输入 0 至 ${fmt(max)} ms 内递增的时间窗口。`;return}timelineStartMs=start;timelineEndMs=end;render()}
function focusGPU(){const data=run().systems,gpu=data.gpu_activity||[];if(!gpu.length)return;timelineStartMs=(Math.min(...gpu.map(g=>g.start_ns))-data.origin_ns)/1e6;timelineEndMs=(Math.max(...gpu.map(g=>g.end_ns))-data.origin_ns)/1e6;timelineKind="gpu";render()}
function showTimelineEvent(id){const data=run().systems,e=data.events[id];if(!e)return;$("timeline-detail").innerHTML=`<strong>${esc(e.name)}</strong><p>${esc(e.kind)} · ${esc(fmt(e.duration_ns/1e6))} ms · ${esc(fmt((e.start_ns-data.origin_ns)/1e6))} → ${esc(fmt((e.end_ns-data.origin_ns)/1e6))} ms</p><pre>${esc(JSON.stringify(e,null,2))}</pre>`}
function render(){history();document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));$("content").innerHTML=run()?(view==="analysis"?analysis():view==="timeline"?timeline():view==="metrics"?metrics():view==="compare"?compare():environment()):"<div class='panel empty'>暂无可查看的实验。用 perf.py run 或 import 创建记录。</div>";if(view==="compare"&&index.length>1)$("compare-b").selectedIndex=1;sectorCalc()}
function sectorCalc(){if(!$("sector-result"))return;const threads=Number($("sector-threads").value),rounds=Number($("sector-rounds").value);if(!Number.isInteger(threads)||threads<1||threads>32||!Number.isInteger(rounds)||rounds<1||rounds>1000000){$("sector-result").textContent="线程需在 1..32，轮数需在 1..1000000，均为整数。";return}const sectors=Math.ceil(threads*4/32)*rounds;$("sector-result").textContent=`唯一数据 ${threads*4} B；累计 ${sectors.toLocaleString()} sectors；访问量折算 ${(sectors*32).toLocaleString()} B。不是 DRAM 实际流量。`}
async function refresh(){if(initial.live){index=await json("/api/runs");cache.clear();selected=index.some(r=>r.id===selected)?selected:index[0]?.id;if(selected)await ensureRun(selected)}if(view==="analysis"&&run()?.systems&&!run()?.launches?.length)view="timeline";render()}
document.addEventListener("click",async event=>{const b=event.target.closest("button");if(!b)return;try{if(b.dataset.run){selected=b.dataset.run;launchId=null;timelineStartMs=timelineEndMs=null;await ensureRun(selected);if(view==="analysis"&&run()?.systems&&!run()?.launches?.length)view="timeline";render()}else if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.metric){metricKey=b.dataset.metric;view="metrics";render()}else if(b.dataset.method){method=b.dataset.method;render()}else if(b.id==="refresh")await refresh();else if(b.id==="timeline-apply"){applyTimelineWindow()}else if(b.id==="timeline-reset"){timelineStartMs=timelineEndMs=null;render()}else if(b.id==="timeline-gpu"){focusGPU()}else if(b.dataset.event!==undefined){showTimelineEvent(Number(b.dataset.event))}else if(b.id==="do-compare"){comparison=await json(`/api/compare?a=${$("compare-a").value}&b=${$("compare-b").value}`);$("comparison").innerHTML=comparisonHTML(comparison)}}catch(error){$("content").textContent=error.message}});
document.addEventListener("change",event=>{if(event.target.id==="launch-select"){launchId=event.target.value;render()}else if(event.target.id==="timeline-kind"){timelineKind=event.target.value;render()}});
document.addEventListener("input",event=>{if(event.target.id==="vocab-filter"){filter=event.target.value;$("vocab-list").innerHTML=vocabRows()}else if(event.target.id==="raw-filter")$("raw-body").innerHTML=rawRows(event.target.value);else if(event.target.id.startsWith("sector-"))sectorCalc()});
$("mode").textContent=initial.live?"本机查看":"离线报告";$("refresh").hidden=!initial.live;
refresh().catch(error=>{$("content").textContent=error.message});
</script></body></html>
